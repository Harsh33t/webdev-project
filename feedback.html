<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback - Solar Explorer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar">
        <div class="logo"><h2>Solar Explorer</h2></div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="sun.html">The Sun</a>
            <a href="extreme.html">Extreme Space</a>
            <a href="missions.html">Missions</a>
            <a href="fun-space.html">Fun Space</a>
            <a href="satellites.html">Satellites</a>
            <a href="feedback.html" class="active">Feedback</a>
        </div>
    </nav>

    <header class="page-header">
        <h1 class="page-title">Feedback</h1>
        <p class="timeline-sub">Share your thoughts on Solar Explorer. Your responses are validated, saved in browser storage, and exported to a downloadable JSON file.</p>
    </header>

    <main class="feedback-container">
        <form id="feedback-form" class="feedback-form" novalidate>
            <div class="form-group">
                <label for="fb-name">Your Name *</label>
                <input type="text" id="fb-name" name="name" placeholder="Enter your full name" required autocomplete="name">
                <span class="field-error" id="err-name" aria-live="polite"></span>
            </div>

            <div class="form-group">
                <label for="fb-email">Email Address *</label>
                <input type="email" id="fb-email" name="email" placeholder="name@example.com" required autocomplete="email">
                <span class="field-error" id="err-email" aria-live="polite"></span>
            </div>

            <div class="form-group">
                <label for="fb-topic">Favourite Section or Topic *</label>
                <select id="fb-topic" name="topic" required>
                    <option value="">-- Select a topic --</option>
                    <option value="Planets">Planets</option>
                    <option value="The Sun">The Sun</option>
                    <option value="Extreme Space">Extreme Space</option>
                    <option value="Missions">Missions</option>
                    <option value="Fun Space">Fun Space</option>
                    <option value="Satellites">Satellites</option>
                </select>
                <span class="field-error" id="err-topic" aria-live="polite"></span>
            </div>

            <div class="form-group">
                <label for="fb-rating">Rating (1 to 5) *</label>
                <select id="fb-rating" name="rating" required>
                    <option value="">-- Select a rating --</option>
                    <option value="5">5 - Excellent (Outstanding content)</option>
                    <option value="4">4 - Very Good (Engaging &amp; informative)</option>
                    <option value="3">3 - Good (Interesting read)</option>
                    <option value="2">2 - Fair (Could be improved)</option>
                    <option value="1">1 - Poor (Needs work)</option>
                </select>
                <span class="field-error" id="err-rating" aria-live="polite"></span>
            </div>

            <div class="form-group">
                <label for="fb-message">Feedback Message *</label>
                <textarea id="fb-message" name="feedback" rows="4" placeholder="What did you find most interesting? How can we improve our Solar Explorer project?" required></textarea>
                <span class="field-error" id="err-message" aria-live="polite"></span>
            </div>

            <div class="form-actions">
                <button type="submit" id="fb-submit-btn" class="btn">SUBMIT &amp; DOWNLOAD JSON</button>
                <button type="reset" id="fb-reset-btn" class="btn btn-secondary">CLEAR FORM</button>
            </div>

            <div id="fb-status" class="form-status" aria-live="polite"></div>
        </form>
    </main>

    <div style="text-align:center;margin:10px 0 60px;">
        <a href="index.html" class="btn">BACK TO HOME</a>
    </div>

    <footer>
        <p>Made by - Aviraj, Harsheet, Pratham, Samarth, Shivansh</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
