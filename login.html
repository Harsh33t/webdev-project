<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solar Explorer - Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation Bar (Original Frontend Navbar) -->
    <nav class="navbar">
        <div class="logo">
            <h2>Solar Explorer</h2>
        </div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="planets.html">Planets</a>
            <a href="missions.html">Missions</a>
            <a href="login.html" class="active">Login</a>
        </div>
    </nav>

    <!-- Full Background Landing Hero with Blur Login Box -->
    <section class="hero-landing login-hero">
        <div class="login-box">
            <h2>Astronaut Login</h2>
            <p class="subtitle">Enter your credentials to access mission control</p>

            <form action="#" method="POST">
                <div class="form-group">
                    <label for="email">Email Address</label>
                    <input type="email" id="email" name="email" placeholder="astronaut@solarexplorer.org" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>

                <button type="submit" class="btn-submit">Login to Dashboard</button>
            </form>
        </div>
    </section>

    <!-- Footer (Original Frontend Footer) -->
    <footer>
        <p>Made by - Aviraj, Harsheet, Pratham, Samarth, Shivansh</p>
    </footer>

</body>

</html>
